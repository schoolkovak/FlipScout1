<title>Aced</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app bar with section tabs over a single-column study desk; the runner is a full-height
   exam frame (slim top bar, passage | question split, bottom controls) modeled on online ACT testing. */
:root{
  --bg:#f4f6fa;--panel:#ffffff;--sunk:#eef1f7;--fg:#13203b;--muted:#5a6680;--line:#d9dfea;
  --accent:#1d5cff;--accent-fg:#ffffff;--accent-soft:#e4ebff;
  --good:#127a45;--good-soft:#e2f4ea;--bad:#c02a2a;--bad-soft:#fbe7e7;--warn:#a86400;--warn-soft:#fdf1dc;
  --flag:#c47a00;--hl:#fff27a;--cur:#e3ebff;
  --s0:#1d5cff;--s1:#d0482b;--s2:#11865a;--s3:#8a4fd8;
  --disp:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131e;--panel:#161d2b;--sunk:#111826;--fg:#e5eaf4;--muted:#9aa5bd;--line:#29334a;
  --accent:#6f98ff;--accent-fg:#0e131e;--accent-soft:#1d2a4d;
  --good:#46c486;--good-soft:#14301f;--bad:#f07070;--bad-soft:#3a1a1a;--warn:#f0b246;--warn-soft:#3a2c12;
  --flag:#f0b03c;--hl:#6d5f00;--cur:#22305a;--s0:#6f98ff;--s1:#ff8a6b;--s2:#4fd08f;--s3:#b88cff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131e;--panel:#161d2b;--sunk:#111826;--fg:#e5eaf4;--muted:#9aa5bd;--line:#29334a;
  --accent:#6f98ff;--accent-fg:#0e131e;--accent-soft:#1d2a4d;
  --good:#46c486;--good-soft:#14301f;--bad:#f07070;--bad-soft:#3a1a1a;--warn:#f0b246;--warn-soft:#3a2c12;
  --flag:#f0b03c;--hl:#6d5f00;--cur:#22305a;--s0:#6f98ff;--s1:#ff8a6b;--s2:#4fd08f;--s3:#b88cff;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 56px}
.appbar{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.brand{font:800 1.7rem/1 var(--disp);letter-spacing:-.02em;margin-right:6px}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap;min-width:0}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg)}
h1,h2,h3{text-wrap:balance}
h2{font:600 1.35rem var(--disp);margin:26px 0 10px}
h3{font:600 1.1rem var(--disp);margin:0}
.sub{color:var(--muted);margin:2px 0 10px;max-width:68ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hero{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.meta{color:var(--muted);font-size:.9rem}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:3px 9px;font-size:.85rem}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{color:var(--flag);border-color:var(--flag)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;padding:0;flex:none}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.switch{display:flex;align-items:center;gap:8px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px;color:var(--fg)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:99px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.new{}
.pill.learning,.pill.understood{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.practicing,.pill.timed{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.pill.mastered,.pill.retained{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.prio{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.prio:first-of-type{border-top:0}
.prio .rank{font:800 1.4rem/1 var(--disp);color:var(--accent);font-variant-numeric:tabular-nums}
.prio .why{grid-column:2/4;color:var(--muted);font-size:.9rem}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.tbl{overflow-x:auto}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.big{font:800 2.6rem/1 var(--disp);color:var(--accent);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 1.5rem/1.1 var(--body);font-variant-numeric:tabular-nums}
.warn{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:6px}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.2}
/* runner */
#test{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.top .ttl{flex:1;font-weight:700;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pause{width:26px;height:26px}
.pause svg{width:12px;height:12px}
#timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:56px}
#timer.low{color:var(--bad)}
#saved{font-size:.75rem;color:var(--muted)}
.main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.main.solo{grid-template-columns:minmax(0,780px);justify-content:center}
.pane{overflow:auto;padding:20px;min-width:0}
.passage{border-right:1px solid var(--line);line-height:1.75}
.passage .pt{font:600 1.1rem var(--disp);margin-bottom:6px}
.passage .intro{color:var(--muted);font-size:.92rem;margin-bottom:10px}
.passage p{margin:0 0 12px;position:relative}
.passage p.num{padding-left:30px}
.passage p.num::before{content:attr(data-p);position:absolute;left:0;top:2px;font:600 .75rem var(--mono);color:var(--muted)}
.passage p.ev{background:var(--good-soft);outline:1px solid var(--good);border-radius:4px}
.passage .ph{font:700 .85rem var(--mono);color:var(--muted);text-align:center;margin:10px 0 2px}
/* Only the current question's portion is underlined and highlighted, as in online ACT testing. */
.passage u{text-decoration:none}
.passage u.cur{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;background:var(--cur);outline:1px solid var(--accent);border-radius:2px}
.passage sup.un{font:600 .62rem var(--mono);color:var(--muted);opacity:.55;margin-left:1px}
.passage u.cur + sup.un{opacity:1;color:var(--fg);border:1px solid var(--accent);border-radius:3px;padding:0 3px;font-weight:700}
.passage .lp{font:700 .8rem var(--mono);color:var(--accent)}
.passage .sn{font:700 .7rem var(--mono);color:var(--muted)}
.passage .pb{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px}
mark{background:var(--hl);color:inherit}
.qnum{font:600 1.1rem var(--disp)}
.stem{margin:8px 0 12px}
.choice{display:flex;align-items:center;gap:8px;margin:8px 0}
.choice label{flex:1;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);cursor:pointer;min-width:0}
.choice input{margin-top:5px;accent-color:var(--accent)}
.choice.sel label{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice.x label{opacity:.45;text-decoration:line-through}
.choice.right label{border-color:var(--good);background:var(--good-soft)}
.choice.wrong label{border-color:var(--bad);background:var(--bad-soft)}
.elim{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;font-size:.8rem;flex:none}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.9rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fb{margin-top:14px;border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.fb.ok{border-color:var(--good)}
.fb.no{border-color:var(--bad)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--good)} .fb.no .verdict{color:var(--bad)}
.lesson{background:var(--sunk);border-radius:8px;padding:10px 12px}
.hint{background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin-top:10px}
.qtimer{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.qtimer i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.qtimer.over i{background:var(--bad)}
.bot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:12px;background:var(--panel);border-top:1px solid var(--line);max-height:30vh;overflow:auto}
.nav button{width:36px;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:.8rem;font-variant-numeric:tabular-nums}
.nav button.ans{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--fg)}
.nav button.fl{box-shadow:inset 0 -4px 0 var(--flag)}
#paused{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;text-align:center;padding:16px}
#calc{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(520px,92vw);height:min(440px,62vh);background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:10;display:flex;flex-direction:column;box-shadow:0 10px 30px #0005}
#calc .h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
#calcEl{flex:1;min-height:0}
.rev{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.ok{color:var(--good)} .no{color:var(--bad)}
/* figures */
.fig{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig figcaption{font-size:.9rem;margin-bottom:6px}
.fig-svg{width:100%;height:auto;max-width:560px;display:block}
.fig-svg text{fill:var(--fg);font:12px var(--body)}
.fig-svg .lab{font-weight:700}
.fig-svg .grid{stroke:var(--line);stroke-width:1}
.fig-svg .axis{stroke:var(--fg);stroke-width:1.2}
.fig-svg .line{fill:none;stroke-width:2}
.fig-svg .s0{stroke:var(--s0);fill:var(--s0)} .fig-svg .s1{stroke:var(--s1);fill:var(--s1)} .fig-svg .s2{stroke:var(--s2);fill:var(--s2)} .fig-svg .s3{stroke:var(--s3);fill:var(--s3)}
.fig-svg .line.s0,.fig-svg .line.s1,.fig-svg .line.s2,.fig-svg .line.s3{fill:none}
.fig-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-top:4px}
.fig-legend svg{vertical-align:middle;margin-right:4px}
.fig-legend .line{fill:none;stroke-width:2}
.fig-legend .s0{stroke:var(--s0);fill:var(--s0)} .fig-legend .s1{stroke:var(--s1);fill:var(--s1)} .fig-legend .s2{stroke:var(--s2);fill:var(--s2)} .fig-legend .s3{stroke:var(--s3);fill:var(--s3)}
.fig-legend .line.s0,.fig-legend .line.s1,.fig-legend .line.s2,.fig-legend .line.s3{fill:none}
.geo{fill:none;stroke:var(--fg);stroke-width:1.6}
.geo.thin{stroke-width:1.1}
.dot{fill:var(--fg)}
.glab{font-weight:700}
.fig-note{font-size:.82rem;color:var(--muted);margin-top:4px}
.fig-table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.fig-table th,.fig-table td{border:1px solid var(--line);padding:4px 9px;text-align:center}
.fig-table th{background:var(--sunk)}
.tw{overflow-x:auto}
@media (max-width:780px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.passage{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}.top .btn{padding:5px 8px;font-size:.85rem}.tabs button{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="app">
  <header class="appbar gx">
    <div class="brand">Ac<span>ed</span></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="study">Study</button>
      <button data-tab="simulate">Practice tests</button>
      <button data-tab="official">Official Scores</button>
      <button data-tab="skills">Skills</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <button class="icon" id="themeBtn" aria-label="Toggle dark mode"></button>
  </header>
  <main id="view" class="wrap gx"></main>
</div>

<div id="test" hidden>
  <div class="top">
    <button class="icon pause" id="pauseBtn" aria-label="Pause"></button>
    <span id="timer"></span>
    <div class="ttl" id="ttl"></div>
    <span id="saved"></span>
    <button class="btn" id="hlBtn" aria-pressed="false">Highlight</button>
    <button class="btn" id="calcBtn" hidden>Desmos</button>
    <button class="btn" id="flagBtn">⚑ Flag</button>
    <button class="icon" id="themeBtn2" aria-label="Toggle dark mode"></button>
  </div>
  <div class="main" id="main"><div class="pane passage" id="passage"></div><div class="pane" id="qpane"></div></div>
  <div class="nav" id="nav" hidden></div>
  <div class="bot" id="bot"></div>
</div>
<div id="paused" hidden><div><h2>Paused</h2><p class="meta">The timer is stopped and the question is hidden.</p><button class="btn pri" id="resumeBtn">Resume</button></div></div>
<div id="calc" hidden><div class="h"><b>Desmos graphing calculator</b><button class="btn sm" id="calcClose" aria-label="Close calculator">×</button></div><div id="calcEl"></div></div>
