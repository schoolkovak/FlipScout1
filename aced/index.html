<title>Aced</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: dashboard of section cards; test view = top bar, passage | question split, bottom nav */
:root{--bg:#f5f7fb;--panel:#fff;--fg:#14213d;--muted:#5b6782;--line:#dbe1ec;--accent:#1f5eff;--good:#14804a;--bad:#c62828;--flag:#d98a00;--hl:#fff27a;
--disp:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--panel:#171e2e;--fg:#e6ebf5;--muted:#9aa6bf;--line:#2a3448;--accent:#6b95ff;--good:#3fbf7f;--bad:#ef6b6b;--flag:#f0b03c;--hl:#7a6a00;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--panel:#171e2e;--fg:#e6ebf5;--muted:#9aa6bf;--line:#2a3448;--accent:#6b95ff;--good:#3fbf7f;--bad:#ef6b6b;--flag:#f0b03c;--hl:#7a6a00;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.home{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:800 2.4rem var(--disp);margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font:600 1.25rem var(--disp)}
.meta{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.hist{margin-top:28px}
.hist table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist td,.hist th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
/* test */
#test{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.top .ttl{flex:1;font-weight:700;text-align:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pause{width:28px;height:28px}
.pause svg{width:13px;height:13px}
#timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:58px}
#timer.low{color:var(--bad)}
.main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.main.solo{grid-template-columns:1fr}
.pane{overflow:auto;padding:20px;min-width:0}
.passage{border-right:1px solid var(--line);white-space:pre-wrap}
.passage u{text-decoration-thickness:2px}
.passage table{border-collapse:collapse;margin:8px 0;white-space:normal}
.passage td,.passage th{border:1px solid var(--line);padding:4px 8px}
mark{background:var(--hl);color:inherit}
.qnum{font:600 1.1rem var(--disp)}
.choice{display:flex;align-items:center;gap:8px;margin:8px 0}
.choice label{flex:1;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.choice input{margin-top:5px}
.choice.sel label{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice.x label{opacity:.45;text-decoration:line-through}
.elim{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;font-size:.8rem}
.bot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:12px;background:var(--panel);border-top:1px solid var(--line)}
.nav button{width:34px;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:.8rem;font-variant-numeric:tabular-nums}
.nav button.ans{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--fg)}
.nav button.fl{box-shadow:inset 0 -4px 0 var(--flag)}
.flagon{color:var(--flag);border-color:var(--flag)}
#paused{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;text-align:center}
#calc{position:fixed;right:16px;bottom:70px;width:min(480px,92vw);height:380px;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:10;display:flex;flex-direction:column;box-shadow:0 10px 30px #0004}
#calc .h{display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line);cursor:move}
#calcEl{flex:1}
.res .big{font:800 3rem var(--disp);color:var(--accent)}
.rev{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:var(--panel)}
.ok{color:var(--good)} .no{color:var(--bad)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
@media (max-width:700px){.main{grid-template-columns:1fr}.passage{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}}
</style>

<div id="home" class="wrap">
  <header class="home"><h1>Ac<span>ed</span></h1><button class="icon" id="themeBtn" aria-label="Toggle theme"></button></header>
  <p class="sub">Enhanced ACT–format practice. Self-grading, field-test items, Desmos on Math, timed or untimed.</p>
  <div class="grid" id="cards"></div>
  <div class="hist"><h3 style="font-family:var(--disp)">Your scores</h3><div id="hist"></div></div>
</div>

<div id="test" hidden>
  <div class="top">
    <button class="icon pause" id="pauseBtn" aria-label="Pause"></button>
    <span id="timer"></span>
    <div class="ttl" id="ttl"></div>
    <button class="btn" id="hlBtn">Highlight</button>
    <button class="btn" id="calcBtn" hidden>Desmos</button>
    <button class="btn" id="flagBtn">⚑ Flag</button>
    <button class="icon" id="themeBtn2" aria-label="Toggle theme"></button>
  </div>
  <div class="main" id="main"><div class="pane passage" id="passage"></div><div class="pane" id="qpane"></div></div>
  <div class="nav" id="nav" hidden></div>
  <div class="bot">
    <button class="btn" id="prevBtn">← Back</button>
    <button class="btn" id="navBtn">Question list</button>
    <button class="btn" id="endBtn">Submit section</button>
    <button class="btn pri" id="nextBtn">Next →</button>
  </div>
</div>
<div id="paused" hidden><div><h2 style="font-family:var(--disp)">Paused</h2><p class="meta">Timer stopped. Questions hidden.</p><button class="btn pri" id="resumeBtn">Resume</button></div></div>
<div id="calc" hidden><div class="h"><b>Desmos</b><button class="btn" id="calcClose">×</button></div><div id="calcEl"></div></div>
<div id="result" class="wrap res" hidden></div>

<script src="questions.js"></script>
<script>
const $=id=>document.getElementById(id);
const ICON={moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>'};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function paintTheme(){const h=isDark()?ICON.sun:ICON.moon;$('themeBtn').innerHTML=h;$('themeBtn2').innerHTML=h;if(calc)calc.updateSettings({invertedColors:isDark()})}
function toggleTheme(){document.documentElement.dataset.theme=isDark()?'light':'dark';store.set('aced-theme',document.documentElement.dataset.theme);paintTheme()}
{const t=store.get('aced-theme',null);if(t)document.documentElement.dataset.theme=t}
$('themeBtn').onclick=$('themeBtn2').onclick=toggleTheme;
const L1=['A','B','C','D'],L2=['F','G','H','J'];
const letters=n=>n%2?L1:L2;
// approximate raw->scale (1-36) by percent correct
function scale(pct){const pts=[[0,1],[.1,8],[.2,12],[.3,14],[.4,16],[.5,19],[.6,21],[.7,24],[.8,27],[.9,31],[.95,34],[1,36]];for(let i=1;i<pts.length;i++)if(pct<=pts[i][0]){const[a,b]=pts[i-1],[c,d]=pts[i];return Math.round(b+(pct-a)/(c-a)*(d-b))}return 36}
let S=null,tick=null,calc=null,hl=false;
function home(){$('home').hidden=false;$('test').hidden=true;$('result').hidden=true;$('calc').hidden=true;
  $('cards').innerHTML=ACED.sections.map((s,i)=>`<div class="card"><h3>${s.name}</h3><div class="meta">${s.items.length} questions · ${s.minutes} min${s.optional?' · optional':''}</div><div class="meta">${s.items.filter(q=>q.ft).length} unscored field-test items</div><div class="row"><button class="btn pri" onclick="start(${i},true)">Timed</button><button class="btn" onclick="start(${i},false)">Untimed</button></div></div>`).join('');
  const h=store.get('aced-hist',[]);
  $('hist').innerHTML=h.length?`<table><tr><th>Date</th><th>Section</th><th>Mode</th><th>Raw</th><th>Score</th></tr>${h.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.sec}</td><td>${r.mode}</td><td>${r.raw}</td><td><b>${r.score}</b></td></tr>`).join('')}</table>${compositeHTML(h)}`:'<p class="meta">No attempts yet. Pick a section above to start.</p>';paintTheme()}
function compositeHTML(h){const last={};h.forEach(r=>last[r.sec]=r.score);const e=last.English,m=last.Math,r=last.Reading,s=last.Science;let o='';
  if(e&&m&&r)o+=`<p>Composite (latest English, Math, Reading): <b>${Math.round((e+m+r)/3)}</b></p>`;if(m&&s)o+=`<p>STEM (Math + Science): <b>${Math.round((m+s)/2)}</b></p>`;return o}
function start(i,timed){const sec=ACED.sections[i];S={i,sec,timed,cur:0,ans:{},x:{},flag:{},left:sec.minutes*60,el:0,paused:false};
  $('home').hidden=true;$('test').hidden=false;$('result').hidden=true;$('ttl').textContent=sec.name;
  $('pauseBtn').hidden=!timed;$('calcBtn').hidden=!sec.calc;$('pauseBtn').innerHTML=ICON.pause;
  clearInterval(tick);tick=setInterval(()=>{if(S.paused)return;S.el++;if(S.timed){S.left--;if(S.left<=0)finish()}showTime()},1000);showTime();render()}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function showTime(){$('timer').textContent=S.timed?fmt(Math.max(0,S.left)):fmt(S.el);$('timer').classList.toggle('low',S.timed&&S.left<300)}
$('pauseBtn').onclick=()=>{S.paused=true;$('paused').hidden=false;$('pauseBtn').innerHTML=ICON.play};
$('resumeBtn').onclick=()=>{S.paused=false;$('paused').hidden=true;$('pauseBtn').innerHTML=ICON.pause};
function render(){const q=S.sec.items[S.cur],n=S.cur+1,lt=S.sec.four===false?['A','B','C','D','E']:letters(n);
  const p=q.p!=null?S.sec.passages[q.p]:null;$('main').classList.toggle('solo',!p);$('passage').hidden=!p;
  if(p&&$('passage').dataset.p!=q.p){$('passage').innerHTML=p;$('passage').dataset.p=q.p}
  $('qpane').innerHTML=`<div class="qnum">Question ${n} of ${S.sec.items.length}</div><p>${q.q}</p>`+q.c.map((c,k)=>`<div class="choice ${S.ans[n]===k?'sel':''} ${S.x[n+'-'+k]?'x':''}"><label><input type="radio" name="a" ${S.ans[n]===k?'checked':''} onchange="pick(${k})"><b>${lt[k]}.</b> <span>${c}</span></label><button class="elim" title="Eliminate" onclick="elim(${k})">${lt[k]}̸</button></div>`).join('');
  $('flagBtn').classList.toggle('flagon',!!S.flag[n]);$('prevBtn').disabled=S.cur==0;$('nextBtn').textContent=S.cur==S.sec.items.length-1?'Review →':'Next →';navR();
  if(window.MathJax)MathJax.typesetPromise?.()}
function navR(){$('nav').innerHTML=S.sec.items.map((_,k)=>`<button class="${S.ans[k+1]!=null?'ans':''} ${k==S.cur?'cur':''} ${S.flag[k+1]?'fl':''}" onclick="go(${k})">${k+1}</button>`).join('')}
function pick(k){S.ans[S.cur+1]=k;delete S.x[S.cur+1+'-'+k];render()}
function elim(k){const key=S.cur+1+'-'+k;S.x[key]=!S.x[key];if(S.x[key]&&S.ans[S.cur+1]===k)delete S.ans[S.cur+1];render()}
function go(k){S.cur=k;render()}
$('prevBtn').onclick=()=>S.cur>0&&go(S.cur-1);
$('nextBtn').onclick=()=>{if(S.cur<S.sec.items.length-1)go(S.cur+1);else{$('nav').hidden=false;navR()}};
$('navBtn').onclick=()=>$('nav').hidden=!$('nav').hidden;
$('flagBtn').onclick=()=>{S.flag[S.cur+1]=!S.flag[S.cur+1];render()};
let confirmEnd=0;$('endBtn').onclick=()=>{const un=S.sec.items.length-Object.keys(S.ans).length;if(un&&Date.now()-confirmEnd>4000){confirmEnd=Date.now();$('endBtn').textContent=`${un} unanswered — click again to submit`;setTimeout(()=>$('endBtn').textContent='Submit section',4000);return}finish()};
$('hlBtn').onclick=()=>{hl=!hl;$('hlBtn').classList.toggle('flagon',hl)};
document.addEventListener('mouseup',()=>{if(!hl)return;const s=getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0);if(!$('passage').contains(r.commonAncestorContainer))return;try{const m=document.createElement('mark');r.surroundContents(m)}catch(e){}s.removeAllRanges()});
$('passage').addEventListener('click',e=>{if(e.target.tagName==='MARK'&&!hl)e.target.replaceWith(...e.target.childNodes)});
// Desmos: official API when hosted normally; falls back to link
$('calcBtn').onclick=()=>{$('calc').hidden=!$('calc').hidden;if(calc||$('calc').hidden)return;
  const s=document.createElement('script');s.src='https://www.desmos.com/api/v1.11/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
  s.onload=()=>{calc=Desmos.GraphingCalculator($('calcEl'),{expressionsCollapsed:false,invertedColors:isDark()})};
  s.onerror=()=>{$('calcEl').innerHTML='<p style="padding:12px">Desmos could not load inside this preview. <a href="https://www.desmos.com/testing/act/graphing" target="_blank" rel="noopener">Open the ACT Desmos calculator</a> in a new tab.</p>'};document.head.appendChild(s)};
$('calcClose').onclick=()=>$('calc').hidden=true;
function finish(){clearInterval(tick);$('calc').hidden=true;$('paused').hidden=true;const items=S.sec.items;let raw=0,tot=0;
  items.forEach((q,k)=>{if(q.ft)return;tot++;if(S.ans[k+1]===q.a)raw++});const sc=scale(raw/tot);
  const h=store.get('aced-hist',[]);h.push({date:new Date().toLocaleDateString(),sec:S.sec.name,mode:S.timed?'Timed':'Untimed',raw:raw+'/'+tot,score:sc});store.set('aced-hist',h);
  $('test').hidden=true;$('result').hidden=false;
  $('result').innerHTML=`<header class="home"><h1>Ac<span>ed</span></h1><button class="btn pri" onclick="home()">Back to tests</button></header>
  <h2 style="font-family:var(--disp)">${S.sec.name} results</h2><div class="big">${sc}</div><p class="meta">Scale score (estimated) · ${raw} of ${tot} scored questions correct · time used ${fmt(S.el)}. Field-test items are shown below but don't count.</p>`+
  items.map((q,k)=>{const n=k+1,lt=S.sec.four===false?['A','B','C','D','E']:letters(n),u=S.ans[n],ok=u===q.a;return `<div class="rev"><b class="${q.ft?'':ok?'ok':'no'}">${n}. ${q.ft?'':ok?'✓':'✗'}</b> ${q.ft?'<span class="tag">Field test · unscored</span>':''} ${S.flag[n]?'<span class="tag">flagged</span>':''}<div>${q.q}</div><div class="meta">Your answer: ${u!=null?lt[u]:'—'} · Correct: <b>${lt[q.a]}</b> (${q.c[q.a]})</div>${q.e?`<div>${q.e}</div>`:''}</div>`}).join('');scrollTo(0,0)}
home();
</script>
