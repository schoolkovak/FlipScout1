name: FlipScout CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check server/API syntax
        run: |
          node --check api/_lib/market.js
          node --check api/_lib/matching.js
          node --check api/deals/search.js
          node --check api/market/pc.js
          node --check api/parts/sniper.js
          node --check api/parts/overview.js
          node --check api/debug/providers.js
          node --check api/flipper/index.js
          node --check api/_lib/flipper.js
          node --check api/_lib/verify.js
          node --check api/_lib/meter.js
          node --check api/_lib/snapshots.js
          node --check api/_lib/summary.js
          node --check scripts/build-snapshots.mjs
          node --check scripts/deal-alerts.mjs
          node --check scripts/newegg.mjs
          node --check scripts/amazon.mjs
          node --check scripts/aliexpress.mjs
          node --check api/analytics.js
          node --check api/_lib/stores.js
          node --check shared/partCatalog.js
          node --check api/providers/test.js
          node --check api/sources.js
          node --check server/index.js
          node --check shared/catalog.js
          node --check shared/sniper.js
          node --check shared/dealSort.js

      - name: Run FlipScout smoke tests
        run: npm test

      - name: Build frontend
        run: npm run build
