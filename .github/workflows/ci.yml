name: FlipScout CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check server/API syntax
        run: |
          node --check api/_lib/market.js
          node --check api/deals/search.js
          node --check api/market/pc.js
          node --check api/parts/sniper.js
          node --check api/providers/test.js
          node --check api/sources.js
          node --check server/index.js
          node --check shared/catalog.js
          node --check shared/sniper.js

      - name: Run FlipScout smoke tests
        run: npm test

      - name: Build frontend
        run: npm run build
