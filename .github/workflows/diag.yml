name: diag
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: |
          cat > p.mjs <<'JS'
          import { fetchAliexpressSearch, aliexpressItems, aliexpressOffers, aliexpressListings } from "./scripts/aliexpress.mjs";
          for (const [q, c, msrp] of [["RTX 3060 12GB", "GPU", 329], ["650W PSU", "Power Supply / PSU", 0], ["ARGB PC case", "PC Case", 0], ["Ryzen 5 5600", "CPU", 199], ["1TB NVMe SSD", "NVMe SSD", 0], ["240mm AIO liquid cooler", "AIO Liquid Cooler", 0]]) {
            try {
              const raw = aliexpressOffers(aliexpressItems(await fetchAliexpressSearch(q)));
              const kept = await aliexpressListings({ query: q, category: c, msrp });
              console.log("\n####", q, "raw", raw.length, "kept", kept.length);
              for (const x of kept.slice(0, 6)) console.log("   ", x.totalPrice, x.shippingEstimated ? "(ship est)" : "", x.condition, x.title.slice(0, 80), x.url);
            } catch (e) { console.log(q, "ERR", e.message); }
            await new Promise(r => setTimeout(r, 5000));
          }
          JS
          SNAPSHOTS_OFF=1 node p.mjs
