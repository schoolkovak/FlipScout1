name: diag
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36";
          const H = { "user-agent": UA, "accept": "text/html", "accept-language": "en-US,en;q=0.9" };
          const state = t => JSON.parse(t.match(/window\.__initialState__\s*=\s*(\{[\s\S]*?\});?\s*<\/script>/)[1]);
          let t = await (await fetch("https://www.newegg.com/p/pl?d=rtx+3060+12gb&N=4131", {headers:H})).text();
          let s = state(t);
          const P = s.Products;
          console.log("n", P.length, "itemcell keys", Object.keys(P[0].ItemCell).join(","));
          for (const p of P.slice(0,12)) { const c = p.ItemCell||{}; console.log(JSON.stringify({combo:p.IsCombo, group:p.IsGroupItem, item:c.Item, title:c.Description?.Title?.slice(0,70), final:c.FinalPrice, unit:c.UnitCost, instock:c.Instock, ship:c.ShippingInfo||c.Shipping||c.FreeShippingFlag, seller:c.Seller||c.SellerName, feat:{n:c.Feature?.IsNew,r:c.Feature?.IsRefurbished,o:c.Feature?.IsOpenBoxed,sbn:c.Feature?.ShipByNewegg}, nm: c.NeweggItemNumber, url: c.UrlKeywords?.slice(0,30), gift: c.AnyFreeGift, rebate:c.MailinRebateCollection?1:0 })); }
          const hrefs = [...t.matchAll(/class="item-title"[^>]*href="([^"]+)"|href="([^"]+)"[^>]*class="item-title"/g)].slice(0,6).map(m=>m[1]||m[2]); console.log("hrefs", hrefs);
          const c0 = P[0].ItemCell; for (const k of Object.keys(c0)) if (/ship|seller|price|free|gift|stock|qty|url|number/i.test(k)) console.log(k, JSON.stringify(c0[k]).slice(0,300));
          // used/refurb filter?
          t = await (await fetch("https://www.newegg.com/Combo-Deals/EventSaleStore/ID-10011", {headers:H})).text();
          s = state(t);
          console.log("PD", JSON.stringify(Object.keys(s.ProductDeals||{})), Array.isArray(s.ProductDeals)?s.ProductDeals.length:"");
          const pd = s.ProductDeals; const arr = Array.isArray(pd)?pd:(pd?.Products||pd?.ProductDealList||Object.values(pd||{}).find(Array.isArray)||[]);
          console.log("deals", arr.length, arr[0] && Object.keys(arr[0]).join(","));
          const combos = arr.filter(x=>x.IsCombo||x.ComboCell);
          console.log("combos", combos.length);
          console.log(JSON.stringify(combos[0]).slice(0,5000));
          console.log("DC", JSON.stringify(s.DynamicCombo).slice(0,1500));
          const tn = s.TopNavigationCellList||[]; console.log("nav", JSON.stringify(tn).slice(0,1500));
          // Combo search page
          t = await (await fetch("https://www.newegg.com/p/pl?d=combo+ryzen", {headers:H})).text();
          s = state(t); const cc = s.Products.filter(x=>x.IsCombo||x.ComboCell); console.log("combo search", s.Products.length, cc.length); if (cc[0]) console.log(JSON.stringify(cc[0].ComboCell).slice(0,4000));
          JS
          node p.mjs
