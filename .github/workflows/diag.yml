name: diag
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.mjs <<'JS'
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36";
          const H = { "user-agent": UA, "accept": "text/html", "accept-language": "en-US,en;q=0.9" };
          const state = t => JSON.parse(t.match(/window\.__initialState__\s*=\s*(\{[\s\S]*?\});?\s*<\/script>/)[1]);
          const seen = new Set();
          for (const q of ["cpu motherboard combo", "amd ryzen combo", "power supply combo", "combo free gift", "cpu combo", "ryzen 5 5600 combo", "ryzen 7 combo"]) {
            const t = await (await fetch("https://www.newegg.com/p/pl?d="+encodeURIComponent(q),{headers:H})).text();
            const s = state(t); const cc = s.Products.filter(x=>x.ComboCell);
            console.log("\n#####", q, s.Products.length, cc.length, "total", s.PageInfo?.TotalCount);
            for (const x of cc.slice(0,6)) {
              const c = x.ComboCell; if (seen.has(c.ComboID)) continue; seen.add(c.ComboID);
              console.log("COMBO", c.ComboID, JSON.stringify({unit:c.UnitCost, disc:c.ComboDiscountAmount, ir:c.TotalInstantRebateAmount, mir:c.TotalItemMIRAmount, promo:c.PromoCodeDiscount, freeShip:c.IsFreeShipping, ship:c.ShippingCharge, gift:c.GiftItemMark, tag:c.ComboSavingTag, stock:c.StockForCombo, type:c.ComboType, promoText:c.PromotionText}));
              for (const it of c.Items) { const ii = it.ItemInfo||{}; const pk = Object.fromEntries(Object.entries(ii).filter(([k,v])=>/price|cost|rebate|amount|ship|stock/i.test(k) && typeof v!=="object")); console.log("   ", it.ItemNumber, it.IsGift, it.Count, it.ZeroPriceMark, (ii.Description?.Title||"").slice(0,60), JSON.stringify(pk)); }
              // displayed price near the combo in html
              const i = t.indexOf("Combo."+c.ComboID); const seg = t.slice(i, i+6000).replace(/<[^>]+>/g," ").replace(/\s+/g," "); const m = seg.match(/\$\s?[\d,]+\.\d\d[^$]{0,80}(\$\s?[\d,]+\.\d\d[^$]{0,80})?/); console.log("    html:", m && m[0].slice(0,200));
            }
          }
          JS
          node p.mjs
