name: diag
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: |
          cat > p.mjs <<'JS'
          import { fetchAmazonSearch, amazonOffers, amazonListings } from "./scripts/amazon.mjs";
          for (const [q, c] of [["RTX 3070", "GPU"], ["650W PSU", "Power Supply / PSU"], ["RGB gaming PC case", "PC Case"], ["Ryzen 5 5600", "CPU"]]) {
            try {
              const html = await fetchAmazonSearch(q);
              const raw = amazonOffers(html);
              console.log("\n####", q, "html", html.length, "raw", raw.length);
              for (const o of raw.slice(0, 6)) console.log("  RAW", o.itemPrice, o.shippingKnown, o.shipping, o.structuredCondition, o.sponsored, o.title.slice(0, 80), o.url, (o.image||"").slice(0,60));
              const items = await amazonListings({ query: q, category: c });
              console.log("  KEPT", items.length); for (const x of items.slice(0, 5)) console.log("   ", x.totalPrice, x.condition, x.title.slice(0, 80));
              if (!raw.length) { const i = html.indexOf('s-search-result'); console.log(html.slice(i - 200, i + 3000)); }
            } catch (e) { console.log(q, "ERR", e.message); }
            await new Promise(r => setTimeout(r, 3000));
          }
          JS
          SNAPSHOTS_OFF=1 node p.mjs
