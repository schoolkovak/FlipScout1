name: diag
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.mjs <<'JS'
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36";
          const H = { "user-agent": UA, "accept": "text/html", "accept-language": "en-US,en;q=0.9" };
          const state = t => JSON.parse(t.match(/window\.__initialState__\s*=\s*(\{[\s\S]*?\});?\s*<\/script>/)[1]);
          const strip = o => JSON.stringify(o, (k,v) => ["Image","NewImage","BulletDescription","Feature","Subscription","VolumeDiscount","Review","Category","Subcategory","Warranty","ItemTime","IMDescription","LineDescription","WebDescription","ShortTitle","ProductName","ManualProductName","Seller"].includes(k)?undefined:v);
          for (const q of ["power supply combo", "cpu motherboard combo", "ryzen 5 combo"]) {
            const t = await (await fetch("https://www.newegg.com/p/pl?d="+encodeURIComponent(q),{headers:H})).text();
            const s = state(t); const cc = s.Products.filter(x=>x.ComboCell);
            console.log("\n#####", q, cc.length);
            const c = cc[0]?.ComboCell; if (!c) continue;
            console.log("combocell keys", Object.keys(c).join(","));
            console.log("items", c.Items.length, "item keys", Object.keys(c.Items[0]).join(","));
            const cp = {...c}; delete cp.Items; console.log("combo top", strip(cp).slice(0,2500));
            for (const it of c.Items) console.log("ITEM", strip(it).slice(0,1500));
            const pn = cc[0].ProductNumber; const hrefs = [...t.matchAll(/href="([^"]*)"/g)].map(m=>m[1]).filter(h=>h.includes(pn)).slice(0,4); console.log("combo hrefs", hrefs);
            for (const x of cc.slice(1,8)) { const y=x.ComboCell; console.log("C", x.ProductNumber, strip({p:y.FinalPrice??y.ComboPrice??y.Price, s:y.Saving??y.SavePrice??y.TotalSaving, titles:y.Items.map(i=>(i.ItemInfo?.Description?.Title||"").slice(0,50))})); }
          }
          // hrefs for marketplace items
          const t = await (await fetch("https://www.newegg.com/p/pl?d=rtx+3060+12gb",{headers:H})).text();
          const hs = [...new Set([...t.matchAll(/href="(https:\/\/www\.newegg\.com\/[^"]*\/p\/[^"#]+)"/g)].map(m=>m[1].replace(/&amp;/g,"&")))].slice(0,12); console.log(hs.join("\n"));
          const s2 = state(t); console.log(s2.Products.slice(0,8).map(p=>p.ProductNumber+" "+p.ItemCell?.Item+" "+p.ItemCell?.ParentItem+" "+p.ItemCell?.Description?.UrlKeywords?.slice(0,40)).join("\n"));
          JS
          node p.mjs
