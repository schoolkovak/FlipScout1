name: Refresh listings
# Background listing builder: saves listings to the `data` branch so every
# page on the site loads saved data instead of spending API credits.
on:
  schedule:
    # GitHub's scheduler often skips this repo's cron, so each run also
    # starts the next one (job "next" below); the cron is only a backup.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Max paid search credits per day"
        required: false
        default: ""
      force_free:
        description: "Re-check every model on the free APIs now (e.g. after a pricing fix)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: snapshots
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check out saved listings
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add snapdata FETCH_HEAD
          else
            mkdir -p snapdata
          fi
      - name: Refresh
        id: refresh
        env:
          SITE: ${{ vars.SNAPSHOT_SITE || 'https://flip-scout-ebon.vercel.app' }}
          BUDGET: ${{ github.event.inputs.budget || vars.SNAPSHOT_DAILY_CREDITS || '60' }}
          MAX_PAID: ${{ vars.SNAPSHOT_MAX_PAID_PER_RUN || '6' }}
          FORCE_FREE: ${{ github.event.inputs.force_free == 'true' && '1' || '0' }}
          # Phone alerts for great deals (free ntfy app). Override with a repo
          # secret NTFY_TOPIC; the default topic is hard to guess.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'flipscout-deals-7f3c9a2e51b84d06' }}
        run: node scripts/build-snapshots.mjs --site="$SITE" --data=snapdata --budget="$BUDGET" --max-paid="$MAX_PAID" --force-free="$FORCE_FREE"
      - name: Publish saved listings
        if: steps.refresh.outputs.changed == 'true'
        run: |
          rm -rf publish && mkdir publish
          cp -r snapdata/models snapdata/links.json snapdata/state.json snapdata/combos.json snapdata/analytics.json publish/ 2>/dev/null || true
          # The data branch is not a site: keep Vercel from trying to deploy it.
          echo '{"git":{"deploymentEnabled":false}}' > publish/vercel.json
          cd publish
          git init -q -b data
          git config user.name "flipscout-snapshots"
          git config user.email "snapshots@users.noreply.github.com"
          git add -A
          git commit -qm "Listings snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
  # Between refreshes: read AliExpress slowly (one search every ~4 minutes,
  # so its captcha never trips), publish, then start the next refresh unless
  # another one is already queued or running (no duplicate chains).
  next:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "NEXT_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check out saved listings
        run: |
          git fetch --depth=1 origin data
          git worktree add snapdata FETCH_HEAD
      - name: Slow lane (Amazon, AliExpress) + real-time deal watcher
        id: refresh
        continue-on-error: true
        env:
          SITE: ${{ vars.SNAPSHOT_SITE || 'https://flip-scout-ebon.vercel.app' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'flipscout-deals-7f3c9a2e51b84d06' }}
        run: node scripts/build-snapshots.mjs --site="$SITE" --data=snapdata --only=aliexpress --aliexpress-per-run=10 --aliexpress-gap-s=240 --time-limit=2700000
      - name: Publish saved listings
        if: steps.refresh.outputs.changed == 'true'
        run: |
          rm -rf publish && mkdir publish
          cp -r snapdata/models snapdata/links.json snapdata/state.json snapdata/combos.json snapdata/analytics.json publish/ 2>/dev/null || true
          echo '{"git":{"deploymentEnabled":false}}' > publish/vercel.json
          cd publish
          git init -q -b data
          git config user.name "flipscout-snapshots"
          git config user.email "snapshots@users.noreply.github.com"
          git add -A
          git commit -qm "Listings snapshot (AliExpress) $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: Start the next refresh
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep refreshes about an hour apart even when there was little to do.
          wait=$(( 2700 - ($(date +%s) - NEXT_START) )); if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          others=$(gh run list --workflow snapshots.yml --limit 20 --json databaseId,status \
            -q '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length')
          if [ "$others" = "0" ]; then gh workflow run snapshots.yml --ref main; echo "next refresh started"; else echo "another refresh is already queued/running"; fi
