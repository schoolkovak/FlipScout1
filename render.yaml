services:
  - type: web
    name: flipscout-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: SERPER_API_KEY
        sync: false
      - key: SEARCHAPI_API_KEY
        sync: false
